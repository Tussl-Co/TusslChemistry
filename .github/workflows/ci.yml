# The parts of scripts/gate.sh that need no benchmark data: formatting, the lint table, the tests
# (unit, API, tidy), and the published schemas themselves. The parity oracles and the coverage run
# need the benchmark data and run locally through scripts/gate.sh.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, resolved 2026-10-08
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - name: The JSON schemas are valid schemas
        run: |
          python3 -m pip install --quiet jsonschema==4.23.0
          python3 -c "import json, jsonschema
          for f in ['schema/report.v1.json', 'schema/emit.v1.json']:
              jsonschema.Draft202012Validator.check_schema(json.load(open(f)))
          print('schemas ok')"
