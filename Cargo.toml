[package]
name = "tussl-chemistry"
version = "0.1.0"
edition = "2024"
# Let-chains (src/emit) need 1.88; rust-toolchain.toml pins the release build to 1.96.1.
rust-version = "1.88"
description = "Names a single-cell RNA library's layout (kit, chemistry, barcode list, strand, library type) from its first reads"
license = "Apache-2.0"
repository = "https://github.com/Tussl-Co/TusslChemistry"
readme = "README.md"
keywords = ["single-cell", "bioinformatics", "fastq", "10x", "chemistry"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "tchem"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
# Swaps the global allocator to count allocations; a dev-dependency, so only test binaries carry it.
allocation-counter = "=0.8.1"

# Strict lints: panic-avoidance and cast lints deny; tests are exempted through clippy.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
lossy_float_literal = "deny"
integer_division = "warn"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_field_names = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# The debug build is the checked build: debug assertions, overflow checks and the debug-only
# cross-checks stay armed, but optimised, so the full parity oracle runs in minutes, not hours
# (unoptimised: 36 s per sample). Same idea as TigerBeetle's ReleaseSafe.
[profile.dev]
opt-level = 2

[profile.release]
debug = 1
# A fired assertion stops the whole process, not one thread.
panic = "abort"
# Arithmetic overflow is a broken invariant; checking it costs little next to the I/O and lookups.
overflow-checks = true
